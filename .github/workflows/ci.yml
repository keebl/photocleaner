# CI for PhotoCleaner: the iOS build and the Android build, unit tests and lint, with the
# commands from CLAUDE.md. From the workbench template github/workflows/ci-swift.yml, with
# an Android job added (the repo holds two native apps). Public repo: macOS minutes are free.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and unit tests
        run: |
          set -o pipefail
          # Runner images drop simulator models over time; pick the newest available iPhone.
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid // empty')
          if [ -z "$UDID" ]; then xcrun simctl list devices available; exit 1; fi
          echo "Simulator: $UDID"
          xcodebuild test -project PhotoCleaner.xcodeproj -scheme PhotoCleaner \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -quiet

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
